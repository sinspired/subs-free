name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PRERELEASE_REGEX: '-(alpha|beta|rc|preview|nightly)'

# 产物命名规范（用户可见架构名统一用 x64/arm64/x86）：
#   APP_NAME_<goos>_<arch>[_variant][.ext]
jobs:
  # 1. 生成 Changelog
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      content: ${{ steps.cliff.outputs.content }}
      core_version: ${{ steps.core.outputs.version }}
      core_commit: ${{ steps.core.outputs.commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect release type
        id: release_type
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ${{ env.PRERELEASE_REGEX }} ]]; then
            echo "type=pre" >> $GITHUB_OUTPUT
          else
            echo "type=stable" >> $GITHUB_OUTPUT
          fi

      - name: Find previous tag
        id: prev_tag
        run: |
          if [[ "${{ steps.release_type.outputs.type }}" == "stable" ]]; then
            # 稳定版：只找上一个稳定版
            prev=$(git tag --list "v[0-9]*" --sort=-version:refname \
              | grep -Ev -- "${{ env.PRERELEASE_REGEX }}" \
              | grep -v -- "${GITHUB_REF_NAME}" | head -n1)
          else
            # 预览版：找上一个任意 tag
            prev=$(git tag --list "v[0-9]*" --sort=-version:refname \
              | grep -v -- "${GITHUB_REF_NAME}" | head -n1)
          fi

          if [ -z "$prev" ]; then
            echo "⚠️ 没有找到上一个 tag，使用仓库初始 commit 作为起点"
            prev=$(git rev-list --max-parents=0 HEAD)
          fi

          echo "tag=$prev" >> $GITHUB_OUTPUT

      # 稳定版 changelog：范围 = 上一个稳定版..当前稳定版
      - name: Build cliff extra args
        id: cliff_args
        run: |
          if [[ "${{ steps.release_type.outputs.type }}" == "stable" ]]; then
            # 用双引号包裹正则，避免括号被 shell 解析
            echo 'extra=--ignore-tags ".*-(alpha|beta|rc|preview|nightly).*"' >> "$GITHUB_OUTPUT"
          else
            echo "extra=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          args: >-
            --strip header
            ${{ steps.cliff_args.outputs.extra }}
            "${{ steps.prev_tag.outputs.tag }}..${{ github.ref_name }}"
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # core_version 直接从 go.mod 读取
      - name: Resolve subs-check-pro core version from go.mod
        id: core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 从 go.mod 精确解析已锁定的版本号（格式：v2.6.2）
          CORE_VERSION=$(grep 'github.com/sinspired/subs-check-pro/v3' go.mod \
            | awk '{print $2}' | tr -d '[:space:]')

          if [ -z "${CORE_VERSION}" ]; then
            echo "⚠️  subs-check-pro/v3 not found in go.mod, falling back to dev"
            CORE_VERSION="dev"
            CORE_COMMIT="unknown"
          else
            echo "📦 core version from go.mod: ${CORE_VERSION}"
            # 通过指定 tag 查 commit SHA（不依赖"最新 release"，确定性）
            # 先尝试轻量 tag（ref/tags），再尝试 annotated tag（object.sha）
            SHA_RAW=$(gh api "repos/sinspired/subs-check-pro/git/ref/tags/${CORE_VERSION}" \
              -q '.object.sha' 2>/dev/null || echo "")

            if [ -z "${SHA_RAW}" ]; then
              # tag 不存在或网络失败，降级
              CORE_COMMIT="unknown"
            else
              # annotated tag 的 object.sha 指向 tag 对象而非 commit，需再查一层
              OBJ_TYPE=$(gh api "repos/sinspired/subs-check-pro/git/ref/tags/${CORE_VERSION}" \
                -q '.object.type' 2>/dev/null || echo "commit")
              if [ "${OBJ_TYPE}" = "tag" ]; then
                SHA_RAW=$(gh api "repos/sinspired/subs-check-pro/git/tags/${SHA_RAW}" \
                  -q '.object.sha' 2>/dev/null || echo "${SHA_RAW}")
              fi
              CORE_COMMIT="${SHA_RAW:0:7}"
            fi
          fi

          echo "version=${CORE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${CORE_COMMIT}"   >> "$GITHUB_OUTPUT"
          echo "core_version=${CORE_VERSION}  core_commit=${CORE_COMMIT}"

  # 2. Android 构建 (独立的工具链)
  build-android:
    name: Build (android/${{ matrix.arch }})
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
          - arch: amd64

    runs-on: ubuntu-latest
    env:
      APP_NAME: subs-free
      VERSION: ${{ github.ref_name }}
      CORE_VERSION: ${{ needs.changelog.outputs.core_version }}
      CORE_COMMIT: ${{ needs.changelog.outputs.core_commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go & Node & Java
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest runner 自带 Android SDK cmdline-tools/platform-tools，
      # 但 NDK 版本不一定装了，这里显式装一个锁定版本，保证可复现构建。
      - name: Install Android NDK
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" --sdk_root=${ANDROID_HOME}
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Task CLI and pnpm
        run: npm install -g @go-task/cli pnpm

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      # 解码签名密钥库。ANDROID_KEYSTORE_FILE secret 存的是 keystore 的 base64
      # 编码内容（本地用 `base64 -w0 your.keystore` 生成后粘进 GitHub Secrets）。
      # 没配置这几个 secret 时，Taskfile 会自动退化为用 debug keystore 签名——
      # 能装能测，但不能用于 Play Store 上传，也不建议用于正式对外分发。
      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_B64 != '' }}
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "${ANDROID_KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_ENV"

      - name: Build & Package APK (release, default)
        run: task android:package ARCH=${{ matrix.arch }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # 同一台 runner、同一套已经装好的 NDK/Node/Java 环境里接着构建 lite 变体，
      # 避免再拉一份 matrix 只为了多编译一次前端 + Go 产物。
      # LITE=true 会让 Taskfile 生成 bin/{{APP_NAME}}-lite.apk（即 subs-free-lite.apk），
      # 与默认构建的 bin/{{APP_NAME}}.apk 互不覆盖。
      - name: Build & Package APK (release, lite)
        run: task android:package ARCH=${{ matrix.arch }} LITE=true
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Collect and Rename Artifacts
        shell: bash
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          case "${GOARCH}" in
            amd64) ARCH_NAME="x64" ;;
            arm64) ARCH_NAME="arm64" ;;
            *)     ARCH_NAME="${GOARCH}" ;;
          esac

          # 这一步现在应该同时拿到默认版和 lite 版两个 apk（bin/subs-free.apk、
          # bin/subs-free-lite.apk），不能再用 `head -1` 只挑一个——那样会静默
          # 丢掉另一个变体。按文件名里是否带 "-lite" 后缀分别重命名。
          shopt -s nullglob
          apks=(bin/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "❌ 未找到 APK 文件"
            exit 1
          fi

          # 重命名策略：subs-free_arm64.apk 和 subs-free_lite_arm64.apk
          for apk in "${apks[@]}"; do
            base=$(basename "${apk}")
            if [[ "${base}" == *-lite.apk ]]; then
              dest="dist/${APP_NAME}_lite_${ARCH_NAME}.apk"
            else
              dest="dist/${APP_NAME}_${ARCH_NAME}.apk"
            fi
            cp "${apk}" "${dest}"
            echo "✅ ${apk} -> ${dest}"
          done

          echo "Android 构建列表"
          ls -lah dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-android-${{ matrix.arch }}
          path: dist/
          retention-days: 1

  # 3. Desktop 构建 (Windows / macOS / Linux)
  build-desktop:
    name: Build (${{ matrix.goos }}/${{ matrix.arch }})
    needs: changelog # 等 changelog 生成完再开始
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows amd64（裸 exe + NSIS installer）──
          - os: windows-latest
            arch: amd64
            goos: windows

          # ── macOS Intel（.app.tar.gz）──
          - os: macos-15-intel
            arch: amd64
            goos: darwin

          # ── macOS Apple Silicon（.app.tar.gz）──
          - os: macos-15
            arch: arm64
            goos: darwin

          # ── Linux amd64（裸二进制 + .deb）──
          - os: ubuntu-24.04
            arch: amd64
            goos: linux

          # ── Linux arm64（裸二进制 + .deb）──
          - os: ubuntu-24.04-arm
            arch: arm64
            goos: linux

    runs-on: ${{ matrix.os }}

    env:
      APP_NAME: subs-free
      # github.ref_name = tag name on tag push, branch name on workflow_dispatch
      VERSION: ${{ github.ref_name }}
      # 从 changelog job 获取已解析好的内核版本，避免 Taskfile 重复网络拉取
      CORE_VERSION: ${{ needs.changelog.outputs.core_version }}
      CORE_COMMIT: ${{ needs.changelog.outputs.core_commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go & Node
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # 1. 全局开启 CGO
      - name: Configure CGO
        shell: bash
        run: echo "CGO_ENABLED=1" >> $GITHUB_ENV

      # 2. Windows 原生 CGO 需要 GCC 编译器（安装 MinGW-w64）
      - name: Install MinGW
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mingw --no-progress -y
          $mingwPath = "C:\ProgramData\mingw64\mingw64\bin"
          echo "$mingwPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "✅ MinGW 已安装，路径: $mingwPath"

      # Windows：NSIS 打包器（用于生成安装包）
      - name: Install NSIS
        id: install_nsis
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $nsisPath = "C:\Program Files (x86)\NSIS"
          echo "$nsisPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Added NSIS to PATH: $nsisPath"

      - name: Verify NSIS installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            $version = & makensis -VERSION
            Write-Host "✅ NSIS 已安装，版本: $version"
          } catch {
            Write-Error "❌ 未检测到 NSIS，请重新运行该 Job 以重新安装 NSIS。"
            exit 1
          }

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Install Task CLI and pnpm
        run: npm install -g @go-task/cli pnpm

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Build & Package (Windows)
        if: runner.os == 'Windows'
        run: |
          task windows:build ARCH=${{ matrix.arch }}
          task windows:package ARCH=${{ matrix.arch }}

      - name: Build & Package (macOS)
        if: runner.os == 'macOS'
        run: |
          task darwin:package ARCH=${{ matrix.arch }}
          task darwin:create:dmg ARCH=${{ matrix.arch }}

      - name: Build & Package (Linux)
        if: runner.os == 'Linux'
        run: |
          task linux:build ARCH=${{ matrix.arch }}
          task linux:create:deb ARCH=${{ matrix.arch }} VERSION=${{ github.ref_name != '' && github.ref_name || 'dev' }}

      # 统一整理产物，重命名为规范格式
      - name: Collect and Rename Artifacts
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist

          case "${GOARCH}" in
            amd64) ARCH_NAME="x64" ;;
            arm64) ARCH_NAME="arm64" ;;
            386)   ARCH_NAME="x86" ;;
            *)     ARCH_NAME="${GOARCH}" ;;
          esac
          PREFIX="${APP_NAME}_${GOOS}_${ARCH_NAME}"

          case "${GOOS}" in
            windows)
              cp "bin/${APP_NAME}.exe" "dist/${PREFIX}.exe"
              NSIS_SRC="bin/${APP_NAME}-${GOARCH}-installer.exe"
              if [ -f "${NSIS_SRC}" ]; then cp "${NSIS_SRC}" "dist/${PREFIX}_setup.exe"; fi
              ;;
            darwin)
              tar czf "dist/${PREFIX}.app.tar.gz" -C bin "${APP_NAME}.app"
              DMG_SRC="bin/${APP_NAME}.dmg"
              if [ -f "${DMG_SRC}" ]; then cp "${DMG_SRC}" "dist/${PREFIX}.dmg"; fi
              ;;
            linux)
              cp "bin/${APP_NAME}" "dist/${PREFIX}"
              DEB_SRC=$(ls bin/*.deb 2>/dev/null | head -1)
              if [ -n "${DEB_SRC}" ]; then cp "${DEB_SRC}" "dist/${PREFIX}.deb"; fi
              ;;
          esac

          echo "构建列表"
          ls -lah dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.arch }}
          path: dist/
          retention-days: 1

  # 4. 汇总产物 → 创建 Release
  release:
    name: Create GitHub Release
    needs: [changelog, build-android, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: List release files
        run: |
          echo "发布文件列表"
          ls -lah dist/

      # ── 生成 SHA256SUMS（供 Wails updater ChecksumAsset 验证）──
      # 文件格式：<sha256sum>  <filename>，与 sha256sum / shasum -a 256 输出一致
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS
          else
            # macOS runner 使用 shasum
            shasum -a 256 * > SHA256SUMS
          fi
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          # 使用 git-cliff 生成的 changelog 作为 release body
          body: ${{ needs.changelog.outputs.content }}
          files: dist/*

  # 5. 发送通知
  notify:
    name: Send Release Notifications
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get release notes
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo 'notes<<EOF'
            gh release view "${{ github.ref_name }}" --json body -q .body
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Send notifications
        uses: sinspired/multi-release-notify@v1
        with:
          summary: >-
            跨平台现代GUI客户端，基于 [Subs Check PRO](https://github.com/sinspired/subs-check-pro) 内核，本地原生界面 + WebUI，可远程管理，后台运行，支持开机自启，Windows 小白可用。
          release_notes: ${{ steps.release.outputs.notes }}
          email_url: ${{ secrets.EMAIL_APPRISE_URL }}
          telegram_url: ${{ secrets.TELEGRAM_APPRISE_URL }}
          urls: |
            ntfy://subs-check-pro?optional=yes&retry=3&wait=5
