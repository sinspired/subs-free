version: '3'

vars:
  APP_NAME: "subs-free"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

  # Target OS for build/package/run. Defaults to the host OS, and is overridden

  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'


  # 内核版本/commit：从 go.mod 解析，用 build/tools/verinfo 这个 Go 小工具实现，
  # 不依赖 Python/Bash，只要能编译本项目就有 go 命令。
  # 可用环境变量覆盖：CORE_VERSION=v2.5.4 CORE_COMMIT=7c23868 task build
  CORE_VERSION:
    sh: go run ./build/tools/verinfo core-version
  CORE_COMMIT:
    sh: go run ./build/tools/verinfo core-commit

  # GUI 自身版本：取当前仓库 git tag
  GUI_VERSION:
    sh: git describe --tags --abbrev=0 2>/dev/null || echo "dev"

env:
  CGO_ENABLED: 1

includes:
  # build/Taskfile.yml 里的通用任务（build:server、build:docker 等根级别便捷任务）
  # 默认按 desktop 处理——它们的 go build 已经显式指向 ./cmd/desktop，
  # 这里的 APP_DIR 只是为了让它们依赖的 build:frontend 找得到 cmd/desktop/frontend。
  common:
    taskfile: ./build/Taskfile.yml
    vars:
      APP_DIR: cmd/desktop
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml
tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"
        vars:
          CORE_VERSION: "{{.CORE_VERSION}}"
          CORE_COMMIT: "{{.CORE_COMMIT}}"
          GUI_VERSION: "{{.GUI_VERSION}}"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"
        vars:
          CORE_VERSION: "{{.CORE_VERSION}}"
          CORE_COMMIT: "{{.CORE_COMMIT}}"
          GUI_VERSION: "{{.GUI_VERSION}}"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Alias for dev:mobile（保留旧用法；明确想跑桌面端用 dev:desktop）
    cmds:
      - task: dev:mobile
  dev:mobile:
    summary: 桌面预览窗口里跑 mobile 端 UI（wails3 dev 热重载），不是真机/模拟器
    dir: cmd/mobile
    cmds:
      - wails3 dev -config ../../build/config.yml -port {{.VITE_PORT}}
  dev:desktop:
    summary: 桌面端 wails3 dev 热重载
    dir: cmd/desktop
    cmds:
      - wails3 dev -config ../../build/config.yml -port {{.VITE_PORT}}

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
